<!doctype html><html><head><meta charset="utf-8"><style>body{font:12px/1.6 Inter,Arial,sans-serif;background:#17211b;color:#d5e8dc;padding:18px;margin:0}h2{font-size:18px;margin:0 0 9px;font-weight:500}p{color:#a5b9ac}input,button{box-sizing:border-box;width:100%;border-radius:6px;padding:11px;border:1px solid #46604e;font:inherit}input{background:#101a14;color:#ddf3e5;margin:8px 0}button{background:#c3eed2;color:#173421;cursor:pointer}small{color:#829e8c}#status{min-height:38px;font-size:11px}</style></head><body><h2>◈ LiquidGlass_For_Figma</h2><p>保持插件打开，即可接收网站发送的矢量玻璃素材。</p><label>本地连接服务的配对码<input id="token" type="password" placeholder="粘贴终端显示的配对码"></label><button id="connect">连接网站</button><p id="status" role="status">请先在项目目录运行 npm run bridge</p><small>仅连接 127.0.0.1:3847。不会上传设计文件。</small><script>
let token='',timer=0,busy=false,active=false;const status=document.getElementById('status');
async function api(path,options={}){const r=await fetch('http://127.0.0.1:3847'+path,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},signal:AbortSignal.timeout(4000)});const d=await r.json();if(!r.ok)throw new Error(d.error||'连接失败');return d;}
async function poll(){if(busy||!active)return;busy=true;try{const data=await api('/plugin/poll');status.textContent='已连接 · 等待网站发送素材';if(data.job){const j=data.job;parent.postMessage({pluginMessage:{type:'import',id:j.id,payload:{svg:j.svg,width:j.width,height:j.height,name:j.name}}},'*');status.textContent='正在导入…';return;}}catch(error){status.textContent='未连接：'+error.message;}busy=false;}
document.getElementById('connect').onclick=()=>{token=document.getElementById('token').value.trim();if(!token){status.textContent='请输入配对码';return;}clearInterval(timer);active=true;busy=false;poll();timer=setInterval(poll,1000);};
window.onmessage=async event=>{if(event.source!==parent)return;const message=event.data.pluginMessage;if(!message||message.type!=='result')return;try{await api('/plugin/ack',{method:'POST',body:JSON.stringify(message)});status.textContent=message.ok?'导入成功 · 可继续从网站发送':'导入失败：'+message.error;}catch{status.textContent='素材处理完成，但确认回传失败；请检查画布后再发送。';}busy=false;};
</script></body></html>
